name: GPUI wgpu platforms
on:
  workflow_dispatch:
  push:
    branches: [gpui_wgpu_backend]
  pull_request:
    branches: [gpui_wgpu_backend]
env:
  RUSTUP_TOOLCHAIN: stable
permissions:
  contents: read
concurrency:
  group: gpui-wgpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
      - run: cargo test --locked -p gpui_wgpu --lib
      - name: Check Linux platform
        if: runner.os == 'Linux'
        run: cargo check --locked -p gpui_linux --features wayland,x11
      - name: Check Windows platform
        if: runner.os == 'Windows'
        run: cargo check --locked -p gpui_windows
      - name: Check macOS platform
        if: runner.os == 'macOS'
        run: cargo check --locked -p gpui_macos
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p gpui_wgpu --target aarch64-linux-android
